<!-- ==================================== -->
<!-- DASHBOARD.HTML -->
<!-- ==================================== -->

<!-- CREATE NOTE FORM -->

<form method="POST"
      action="{{ url_for('routes.create_note') }}">

    <!-- CSRF TOKEN -->
    <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token() }}">

    <!-- NOTE CONTENT -->
    <textarea name="content"
              placeholder="Write secure note..."
              required></textarea>

    <!-- SUBMIT -->
    <button type="submit">
        Save Note
    </button>

</form>


<!-- ==================================== -->
<!-- NOTES LIST -->
<!-- ==================================== -->

{% for note in notes %}

<div class="note-card">

    <p>{{ note.content }}</p>

    <small>{{ note.created_at }}</small>

    <!-- DELETE FORM -->
    <form method="POST"
          action="{{ url_for('routes.delete_note', note_id=note.id) }}">

        <!-- CSRF TOKEN -->
        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <!-- DELETE BUTTON -->
        <button type="submit"
                class="btn btn-danger btn-sm">
            Delete
        </button>

    </form>

</div>

{% endfor %}
