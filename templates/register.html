<!-- REGISTER.HTML -->
<!-- ==================================== -->

<form method="POST">

    <!-- CSRF TOKEN -->
    <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token() }}">

    <!-- USERNAME -->
    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <!-- EMAIL -->
    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <!-- PASSWORD -->
    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <!-- SUBMIT -->
    <button type="submit">
        Register
    </button>

</form>
